name: Chasse Oracle A1

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: oracle-hunt

jobs:
  tenter:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet oci

      - name: Ecrire la cle API
        run: |
          printf '%s' "${{ secrets.OCI_KEY }}" > oci_key.pem
          chmod 600 oci_key.pem

      - name: Chasse en boucle
        env:
          PYTHONUNBUFFERED: "1"
          OCI_USER:        ${{ secrets.OCI_USER }}
          OCI_TENANCY:     ${{ secrets.OCI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_REGION:      ${{ secrets.OCI_REGION }}
          OCI_SUBNET:      ${{ secrets.OCI_SUBNET }}
          OCI_IMAGE:       ${{ secrets.OCI_IMAGE }}
          OCI_SSH_KEY:     ${{ secrets.OCI_SSH_KEY }}
        run: python hunt.py

      - name: Effacer la cle
        if: always()
        run: rm -f oci_key.pem
